[project]
name = "loandefaultpredictor"
version = "0.1.0"
description = "LoanForest is a Streamlit web application that predicts the risk of loan default using a Random Forest machine learning model."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "matplotlib-inline>=0.2.2",
    "pymysql>=1.1.3",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.49",
    "zenml[server]>=0.94.4",
]
