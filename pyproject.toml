[project]
name = "loandefaultpredictor"
version = "0.1.0"
description = "LoanForest is a Streamlit web application that predicts the risk of loan default using a Random Forest machine learning model."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "imbalanced-learn>=0.14.1",
    "ipykernel>=7.2.0",
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "matplotlib-inline>=0.2.2",
    "numpy>=2.4.5",
    "optuna>=4.9.0",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "pymysql>=1.1.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "sqlalchemy>=2.0.49",
    "zenml[server]>=0.94.4",
]
